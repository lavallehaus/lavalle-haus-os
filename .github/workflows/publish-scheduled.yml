name: Publish scheduled posts
# Vercel Hobby crons only run daily, so this pinger fires the publish sweep
# every 15 minutes. GitHub may delay scheduled runs a few minutes under load —
# fine for social posting.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish sweep
        run: |
          curl -fsS -X POST "https://lavalle-haus-os.vercel.app/api/data?op=publish_due" \
            -H "x-publish-key: ${{ secrets.PUBLISH_KEY }}"
      # Also sweep The Fold's Drive folders so a freshly uploaded cover or a
      # reel named "4" lands on Post 4 within ~15 minutes, not next morning.
      - name: Fold cover + asset sync
        run: |
          curl -fsS -X POST "https://lavalle-haus-os.vercel.app/api/data?op=fold_cover_sync" \
            -H "x-publish-key: ${{ secrets.PUBLISH_KEY }}" --max-time 120 -o /dev/null || true
      # Lavalle Sisters: when Post 10 is checked off, archive montages to Drive
      # and rotate in the next 21-post cycle (staged; each tick resumes safely).
      # Mirror new Loft deliveries into Sisters/<working month>/Courtney to edit
      # (self-sunsets when the Loft contract ends Oct 2026).
      - name: Loft to Sisters copy
        run: |
          curl -fsS -X POST "https://lavalle-haus-os.vercel.app/api/data?op=loft_sisters_sync" \
            -H "x-publish-key: ${{ secrets.PUBLISH_KEY }}" --max-time 120 -o /dev/null || true
      # File the Loft's monthly strategy PDF from Slack into Drive
      # (sunsets with the Loft contract, Oct 2026).
      - name: Slack strategy PDF watch
        run: |
          curl -fsS -X POST "https://lavalle-haus-os.vercel.app/api/data?op=slack_strategy_watch" \
            -H "x-publish-key: ${{ secrets.PUBLISH_KEY }}" --max-time 120 -o /dev/null || true
      - name: Sisters cycle check
        run: |
          curl -fsS -X POST "https://lavalle-haus-os.vercel.app/api/data?op=sisters_cycle_check" \
            -H "x-publish-key: ${{ secrets.PUBLISH_KEY }}" --max-time 120 -o /dev/null || true
