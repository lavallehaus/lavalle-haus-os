<style>
:root{--paper:#F4F1EA;--paper2:#FBFAF6;--header:#EDEAE3;--ink:#26221C;--soft:#6B6459;--muted:#9A9387;--line:
#DCD7CC;--gold:#A9873F;--terra:#9C4A39;--sage:#7d8a72;--btn:#2A2620;--serif:"EB Garamond",Georgia,serif;--
sans:"Jost",Arial,sans-serif;--lw:250px;}
*{box-sizing:border-box;}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;-
webkit-font-smoothing:antialiased;font-feature-settings:"onum" 1;}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(14px,3vw,40px);}
.util{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-
transform:uppercase;text-align:center;padding:8px;font-weight:300;}.util span{opacity:.72;}
header{background:var(--header);border-bottom:1px solid var(--line);}
.mast{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 0;flex-wrap:wrap;}
.brand b{font-weight:500;letter-spacing:.34em;font-size:18px;display:block;padding-left:.34em;}
.brand small{font-family:var(--sans);font-weight:300;font-size:9px;letter-spacing:.3em;color:var(--muted);text-transform:
uppercase;display:block;margin-top:6px;padding-left:.32em;}
.ctrls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-family:var(--sans);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.field input,.field select{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--paper2);border:1px
solid var(--line);padding:8px 10px;}
.langtog{display:flex;border:1px solid var(--line);}
.langtog button{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--
paper2);border:0;padding:8px 13px;cursor:pointer;color:var(--soft);}
.langtog button.on{background:var(--btn);color:var(--paper);}
.titleblock{padding:24px 0 4px;}
.titleblock h1{font-weight:500;font-size:clamp(24px,3.4vw,36px);margin:0;line-height:1.06;}
.titleblock .es{font-style:italic;color:var(--soft);font-size:clamp(13px,1.8vw,17px);margin-top:5px;display:block;}
.titleblock p{font-family:var(--sans);font-size:11.5px;color:var(--soft);max-width:80ch;margin:12px 0 0;line-height:1.7;}
.titleblock p .pes{display:block;color:var(--muted);}
/* tabs */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--ink);margin-top:18px;overflow-x:auto;}
.tabbar button{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);
background:none;border:0;padding:13px 18px;cursor:pointer;white-space:nowrap;position:relative;}
.tabbar button .c{color:var(--muted);font-size:10px;margin-left:6px;}
.tabbar button.on{color:var(--ink);}
.tabbar button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--
gold);}
/* calendar */
.calwrap{margin:20px 0 6px;}

.calhd{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-
weight:500;margin-bottom:10px;}
.cal{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;}
.cell{border:1px solid var(--line);background:var(--paper2);padding:11px 12px;min-width:108px;}
.cell .mo{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.cell .big{font-family:var(--serif);font-size:28px;font-weight:500;line-height:1.05;margin-top:6px;}
.cell .sub{font-family:var(--sans);font-size:9px;letter-spacing:.03em;color:var(--soft);margin-top:5px;line-height:1.5;}
.cell .sent{color:var(--sage);}.cell.zero .big{color:var(--muted);opacity:.5;}
/* phase + gantt */
.phase{margin-top:28px;}
.phhead{border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:4px;}
.phtop{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;}
.phtop .pn{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-
weight:500;}
.badges{display:flex;gap:7px;flex-wrap:wrap;}
.bdg{font-family:var(--sans);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border:1px
solid var(--line);color:var(--soft);}
.bdg.fit{border-color:#7d8a7255;background:#DCE5D755;color:var(--sage);}
.bdg.like{border-color:#A9873f55;background:#F0E6CE66;color:var(--gold);}
.phwhy{font-family:var(--sans);font-size:11px;color:var(--soft);line-height:1.6;margin-top:8px;max-width:92ch;}
.tlhead{position:relative;height:18px;margin:14px 0 2px;margin-left:var(--lw);}
.tick{position:absolute;top:0;transform:translateX(-50%);font-family:var(--sans);font-size:9px;letter-spacing:.06em;text-
transform:uppercase;color:var(--muted);white-space:nowrap;}
.grow{display:grid;grid-template-columns:var(--lw) 1fr;border-bottom:1px solid var(--line);padding:4px 0 2px;}
.ginfo{padding:12px 14px 12px 0;}
.ginfo .nm{font-size:18px;line-height:1.12;}
.ginfo .meta{font-family:var(--sans);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
margin-top:3px;}
.ginfo .why{font-family:var(--sans);font-size:10px;color:var(--soft);line-height:1.5;margin-top:6px;}
.ginfo .badges{margin-top:7px;}
.emailrow{display:flex;align-items:center;gap:6px;margin-top:8px;}
.emailrow input{flex:1;font-family:var(--sans);font-size:11px;border:1px solid var(--line);background:var(--
paper);padding:6px 7px;color:var(--ink);min-width:0;}
.emailrow .el{font-family:var(--sans);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.rowacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
.rowacts button{font-family:var(--sans);font-size:8.5px;letter-spacing:.08em;text-transform:
uppercase;background:none;border:1px solid var(--line);padding:5px 8px;cursor:pointer;color:var(--soft);}
.rowacts .del:hover{border-color:var(--terra);color:var(--terra);}
.rowacts .noresp:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.rowacts .back:hover{border-color:var(--sage);color:var(--sage);}
.rowacts button:disabled{opacity:.4;cursor:not-allowed;}
.track{position:relative;border-left:1px solid var(--line);min-height:54px;}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.55;}
.bar{position:absolute;top:24px;height:2px;background:var(--gold);opacity:.4;}
.mk{position:absolute;top:16px;transform:translateX(-50%);width:34px;text-align:center;cursor:pointer;}
.mk .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gold);background:var(--paper);color:var(--
gold);font-family:var(--sans);font-size:10px;line-height:18px;margin:0 auto;}
.mk.done .dot{background:var(--sage);border-color:var(--sage);color:#fff;}
.mk .dl{font-family:var(--sans);font-size:8px;color:var(--muted);margin-top:3px;white-space:nowrap;}
.mk.done .dl{color:var(--sage);}
/* log + inline editable emails */
.log{grid-column:1 / -1;padding:6px 0 14px var(--lw);display:flex;flex-direction:column;gap:9px;}
.logc{border:1px solid var(--line);background:var(--paper2);}
.logc.sent{border-color:#7d8a7255;background:#DCE5D733;}
.logc .lh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;}
.logc .et{font-family:var(--sans);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-
weight:500;min-width:118px;}
.logc .pl{font-family:var(--sans);font-size:9px;color:var(--muted);}
.logc .ctl{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.logc .ctl label{font-family:var(--sans);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.logc input[type=date],.logc select{font-family:var(--sans);font-size:11px;border:1px solid var(--line);background:var(--
paper);padding:6px 7px;color:var(--ink);}
.emd{border-top:1px dashed var(--line);}
.emd summary{font-family:var(--sans);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
cursor:pointer;padding:9px 12px;list-style:none;}
.emd summary::-webkit-details-marker{display:none;}
.emd summary::before{content:"\25B8 ";color:var(--gold);}
.emd[open] summary::before{content:"\25BE ";}
.emd summary:hover{color:var(--ink);}
.emin{padding:0 12px 12px;}
.fl{font-family:var(--sans);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px
0 4px;}
.subjin{width:100%;font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid
var(--line);padding:8px 10px;}
.bodyin{width:100%;font-family:var(--serif);font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--
paper);border:1px solid var(--line);padding:10px 12px;resize:vertical;min-height:150px;margin-top:4px;}
.ebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.ebtns button{font-family:var(--sans);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:8px
13px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--soft);}
.ebtns .send{background:var(--btn);color:var(--paper);border-color:var(--btn);}.ebtns .send:hover{background:var(--
gold);border-color:var(--gold);}
.ebtns button:hover{border-color:var(--gold);color:var(--gold);}.ebtns .send:hover{color:var(--paper);}
.empty{padding:50px 0;text-align:center;color:var(--muted);font-style:italic;}
footer{border-top:1px solid var(--line);background:var(--paper2);padding:24px 0;font-family:var(--sans);font-
size:11px;letter-spacing:.05em;color:var(--muted);text-align:center;line-height:1.8;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--
btn);color:var(--paper);font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
padding:12px 22px;opacity:0;transition:all .3s;z-index:200;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:900px){:root{--lw:170px;}.logc .ctl{margin-left:0;}}
@media(max-width:640px){:root{--lw:128px;}.ginfo .why{display:none;}.logc .et{min-width:0;}}
.subbar{display:flex;gap:4px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.subtab{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);

.subtab .c{color:var(--muted);margin-left:5px;}
.subtab.on{background:var(--btn);color:var(--paper);border-color:var(--btn);}
.research-btn{font-family:var(--sans);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--
paper);background:var(--gold);border:0;padding:9px 14px;cursor:pointer;margin-left:auto;}
.research-btn:hover{background:var(--btn);}
.rpanel{border:1px solid var(--gold);background:#F0E6CE2b;margin-top:14px;padding:16px 18px;}
.rpanel h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 2px;}
.rpanel .rsub{font-family:var(--sans);font-size:10.5px;color:var(--soft);line-height:1.6;margin-bottom:12px;}
.rcard{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-top:1px solid var(--
line);padding:11px 0;}
.rcard .rn{font-size:16px;}
.rcard .rm{font-family:var(--sans);font-size:9.5px;letter-spacing:.04em;color:var(--muted);text-transform:
uppercase;margin-top:2px;}
.rcard .rw{font-family:var(--sans);font-size:11px;color:var(--soft);margin-top:5px;line-height:1.5;max-width:62ch;}
.rcard .addbtn{font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--
btn);color:var(--paper);border:0;padding:8px 13px;cursor:pointer;white-space:nowrap;}
.rcard .addbtn:hover{background:var(--gold);}
.rcard .addbtn:disabled{background:var(--sage);cursor:default;}
.glink{display:inline-block;margin-top:12px;font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-
transform:uppercase;color:var(--gold);border-bottom:1px solid var(--gold);padding-bottom:2px;}
.rnote{font-family:var(--sans);font-size:10px;color:var(--muted);line-height:1.6;margin-top:10px;}

title="${lang==='en'?'Enabled after the third email is logged':'Se activa al registrar el tercer correo'}">${lang==='en'?'No response, move':'Sin respuesta, mover'}</button><button class="del" data-
id="${encodeURIComponent(s.id)}">${lang==='en'?'Not a fit, remove':'No encaja, quitar'}</button>`;
  const labs=lang==='en'?['Email 1','Email 2','Email 3']:['Email 1','Email 2','Email 3'];
  const sublab=lang==='en'?['reintroduction','one month later','two months later']:['reconexion','un mes despues','dos meses despues'];
  let logblocks='';
  for(let i=0;i<3;i++){const e=getMail(s,i);const lv=(lg['e'+i]&&lg['e'+i]) ||{};
    logblocks+=`<div class="logc ${lv.date?'sent':''}">
      <div class="lh"><span class="et">${labs[i]} <span style="color:var(--muted)">${sublab[i]}</span></span><span
class="pl">${lang==='en'?'plan':'plan'} ${fmt(dts[i])}</span>
        <div class="ctl"><label>${lang==='en'?'sent':'enviado'}</label><input type="date" class="sd" data-
id="${encodeURIComponent(s.id)}" data-i="${i}" value="${lv.date||''}">
        <label>${lang==='en'?'by':'por'}</label><select class="by" data-id="${encodeURIComponent(s.id)}" data-
i="${i}">${teamOpts(lv.by||'')}</select></div></div>
      <details class="emd"><summary>${lang==='en'?'Email text, edit and send':'Texto del correo, editar y enviar'}
</summary>
        <div class="emin"><div class="fl">${lang==='en'?'Subject':'Asunto'}</div>
        <input class="subjin" data-id="${encodeURIComponent(s.id)}" data-i="${i}" value="${esc(e.sub).replace(/" /g,'&quot;')}">
        <textarea class="bodyin" data-id="${encodeURIComponent(s.id)}" data-i="${i}" rows="${Math.max(9,e.body. split('\n').length+1)}">${esc(e.body)}</textarea>
        <div class="ebtns"><button class="send" data-id="${encodeURIComponent(s.id)}" data-i="${i}">Send /
Enviar</button>
          <button class="copy" data-id="${encodeURIComponent(s.id)}" data-i="${i}">Copy / Copiar</button>
          <button class="resetx" data-id="${encodeURIComponent(s.id)}" data-i="${i}">Reset / Restaurar</button>
          <button class="marktoday" data-id="${encodeURIComponent(s.id)}" data-i="${i}">${lang==='en'?'Mark sent today':'Marcar enviado hoy'}</button></div></div></details></div>`;
  }
  const site=s.web?` &middot; <a href="https://${s.web}" target="_blank" rel="noopener" style="color:var(--soft);border- bottom:1px solid var(--line)">site</a>`:'';
  return `<div class="grow">
    <div class="ginfo"><div class="nm">${s.store}</div>
      <div class="meta">${s.type} &middot; ${s.city}${site}</div>
      <div class="why">${lang==='en'?s.whyEn:s.whyEs}</div>
      <div class="emailrow"><span class="el">${lang==='en'?'to':'para'}</span><input class="recip" data-
id="${encodeURIComponent(s.id)}" placeholder="${lang==='en'?'add email':'agregar correo'}"
value="${esc(emailOf(s))}"></div>
      <div class="badges">${badge}</div>
      <div class="rowacts">${acts}</div></div>
    <div class="track">${gridlines()}${bar}${mks}</div>
    <div class="log">${logblocks}</div>
  </div>`;
}
function render(){
  buildHead();buildTabs();buildSubtabs();buildCal();buildResearch();
  const c=document.getElementById('content');
  if(tab==='noresp'){
    const st=viewStores('noresp',subcat['noresp']);
    if(!st.length){c.innerHTML=`<div class="empty">${lang==='en'?'No stores here yet. Move a row here after the third email goes out with no reply.':'Aun no hay tiendas aqui. Mueve una fila despues de que el tercer correo salga sin respuesta.'}</div>`;return;}
    c.innerHTML=`<section class="phase"><div class="phhead"><div class="phtop"><div
class="pn">${lang==='en'?'No response after three emails':'Sin respuesta tras tres correos'}</div><div
class="badges"><span class="bdg">${st.length} stores</span></div></div></div>`+
      `<div class="tlhead">${tlHead()}</div>`+st.map(storeRow).join('')+`</section>`;
    wire();return;
  }
  let html='';
  activePhases(tab).forEach(({p,i})=>{
    const g=viewStores(tab,subcat[tab]).filter(s=>s.phase===i);if(!g.length)return;
    const kick=planned(g[0],0).toLocaleDateString(lang==='en'?'en-US':'es-MX',{month:'long',year:'numeric'});
    const bdgs=p.exp?`<span class="bdg">Kickoff ${kick}</span><span class="bdg like">Direction, body and
beauty</span><span class="bdg fit">International reference</span><span class="bdg">${g.length} stores</span>`
      :`<span class="bdg">Kickoff ${kick}</span><span class="bdg like">Likelihood ${p.like}</span><span class="bdg fit">Brand fit ${p.fit}</span><span class="bdg">${g.length} stores</span>`;
    html+=`<section class="phase"><div class="phhead"><div class="phtop"><div class="pn">Phase ${p.n} / Fase
${p.n} &nbsp; ${lang==='en'?p.en:p.es}</div><div class="badges">${bdgs}</div></div><div
class="phwhy">${lang==='en'?p.rEn:p.rEs}</div></div>`;
    html+=`<div class="tlhead">${tlHead()}</div>`+g.map(storeRow).join('')+`</section>`;
  });
  if(!html){const cat=(CATS.find(x=>x.id===subcat[tab])||{}).en;c.innerHTML=`<div class="empty">${lang==='en'?('No '+cat+' stores in this tab yet. Tap Deep Research to pull fitting stores from Google.'):('Aun no hay tiendas de este tipo en esta pestana. Toca Deep Research para traer tiendas desde Google.')}</div>`;wire();return;}
  c.innerHTML=html;wire();
}
/* ---------- email templates ---------- */
function sig(by){const n=by||(lang==='en'?'Kiabeth and Kiaredza':'Kiabeth y Kiaredza');return lang==='en'?
`Warmly,\n${n}\nLavalle Haus, 831.359.5978`:`Con carino,\n${n}\nLavalle Haus, 831.359.5978`;}
function tmpl(s,i){
  const by=(S.store[s.id]&&S.store[s.id].log&&S.store[s.id].log['e'+i]&&S.store[s.id].log['e'+i].by)||'';
  const hi=lang==='en'?`Hi ${s.store} Team,`:`Hola equipo de ${s.store},`;
  const descL=(s.desc||'').charAt(0).toLowerCase()+(s.desc||'').slice(1);
  if(i===0){
    if(s.exp){const sub=lang==='en'?`Introducing Lavalle Haus to ${s.store}`:`Presentando Lavalle Haus a ${s.store}`;
      const body=lang==='en'?[hi,'',`We are the sisters behind Lavalle Haus, a California clean body care brand built on
essential oils, plastic free packaging, and a quiet, considered design.`,'',`We admire ${s.store} as exactly the kind of
${descL} we hope to grow alongside as we expand into body and beauty retail.`,'',`Our collection: The Evening
Candle, Soaking Salts, Daily Body Oil, and Beldi Black Soap.`,'',`We would love to explore whether there is a fit and
send samples or a line sheet. Catalog and wholesale pricing: (link)`,'',sig(by)].join('\n')
       :[hi,'',`Somos las hermanas detras de Lavalle Haus, una marca de cuidado corporal limpio de California, basada
en aceites esenciales, empaque sin plastico y un diseno sereno y cuidado.`,'',`Admiramos ${s.store} como justo el tipo
de ${descL} con el que esperamos crecer al expandirnos a cuerpo y belleza.`,'',`Nuestra coleccion: Vela de noche,
Sales de bano, Aceite corporal y Jabon negro Beldi.`,'',`Nos encantaria explorar si hay encaje y enviar muestras o un
line sheet. Catalogo y precios: (enlace)`,'',sig(by)].join('\n');
      return {sub,body};}
    const sub=lang==='en'?`Reintroducing Lavalle Haus to ${s.store}`:`Reconectando: Lavalle Haus y ${s.store}`;
    const body=lang==='en'?[hi,'',`It has been about two years since we first reached out, and a great deal has grown
on our side since then. We are the sisters behind Lavalle Haus, a California clean body care brand built on essential
oils, plastic free packaging, and a quiet, considered design.`,'',`We thought of ${s.store} again because of what you do
best, ${descL}. It felt like a natural home for our line.`,'',`Our collection: The Evening Candle, Soaking Salts, Daily
Body Oil, and Beldi Black Soap.`,'',`We would love to send a sample set if it feels like a fit. Catalog and wholesale
pricing: (link)`,'',sig(by)].join('\n')
     :[hi,'',`Han pasado unos dos anos desde que les escribimos por primera vez, y mucho ha crecido de nuestro lado.
Somos las hermanas detras de Lavalle Haus, una marca de cuidado corporal limpio de California, basada en aceites
esenciales, empaque sin plastico y un diseno sereno y cuidado.`,'',`Volvimos a pensar en ${s.store} por lo que mejor
hacen, ${descL}. Nos parecio un hogar natural para nuestra linea.`,'',`Nuestra coleccion: Vela de noche, Sales de
bano, Aceite corporal y Jabon negro Beldi.`,'',`Nos encantaria enviar un set de muestras si les parece adecuado.
Catalogo y precios: (enlace)`,'',sig(by)].join('\n');
    return {sub,body};
  }
  if(i===1){const sub=lang==='en'?`A second hello from Lavalle Haus`:`Un segundo saludo de Lavalle Haus`;
    const body=lang==='en'?[hi,'',`Circling back with a warm second note. We still believe our candles and body care
would feel right at home at ${s.store}.`,'',`Happy to send whatever is most useful: a sample set, a line sheet, or
wholesale pricing. Catalog here: (link)`,'',sig(by)].join('\n')
     :[hi,'',`Regresamos con un segundo saludo. Seguimos creyendo que nuestras velas y cuidado corporal se sentirian
muy bien en ${s.store}.`,'',`Con gusto enviamos lo que sea mas util: un set de muestras, un line sheet o precios de
mayoreo. Catalogo aqui: (enlace)`,'',sig(by)].join('\n');
    return {sub,body};}
  const sub=lang==='en'?`One last note, with seasonal samples`:`Una ultima nota, con muestras de temporada`;
  const body=lang==='en'?[hi,'',`Reaching out one last time for now. We just refreshed our seasonal scents and would
gladly send a sample set to ${s.store} if you are open to it.`,'',`Either way, thank you for the work you do. We are
genuine admirers of ${s.store}.`,'',sig(by)].join('\n')
   :[hi,'',`Les escribimos una ultima vez por ahora. Acabamos de renovar nuestros aromas de temporada y con gusto
enviamos un set de muestras a ${s.store} si estan abiertos.`,'',`De cualquier modo, gracias por su trabajo. Somos
admiradoras de ${s.store}.`,'',sig(by)].join('\n');
  return {sub,body};
}
function getMail(s,i){const r=S.store[s.id];const e=r&&r.edits&&r.edits[lang]&&r.edits[lang][i];return e?e:tmpl(s,i);}
/* ---------- interactions ---------- */
function wire(){
  const c=document.getElementById('content');
  c.querySelectorAll('.sd').forEach(el=>el.onchange=()=>{const id=decodeURIComponent(el.dataset.id),i=+el.dataset.i;
const r=rec(id);r.log['e'+i]=r.log['e'+i]||{};r.log['e'+i].date=el.value;persist();render();});
  c.querySelectorAll('.by').forEach(el=>el.onchange=()=>{const id=decodeURIComponent(el.dataset.id),i=+el.dataset.i;
    if(el.value==='__add'){const nm=(prompt(lang==='en'?'New teammate name:':'Nombre del integrante:')||'').trim();if(
nm){if(!S.team.includes(nm))S.team.push(nm);const r=rec(id);r.log['e'+i]=r.log['e'+i]||{};r.log['e'+i].by=nm;
persist();render();}else render();return;}
    const r=rec(id);r.log['e'+i]=r.log['e'+i]||{};r.log['e'+i].by=el.value;persist();});
  c.querySelectorAll('.recip').forEach(el=>el.oninput=()=>{const id=decodeURIComponent(el.
dataset.id);rec(id).email=el.value;persist();});
  c.querySelectorAll('.subjin,.bodyin').forEach(el=>el.oninput=()=>{const id=decodeURIComponent(el.
dataset.id),i=+el.dataset.i;const r=rec(id);r.edits[lang]=r.edits[lang]||{};
    const root=el.closest('.emin');const sub=root.querySelector('.subjin').value,body=root.querySelector('.bodyin').
value;r.edits[lang][i]={sub,body};persist();});
  c.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{const root=b.closest('.emin');copyText('Subject: '+root.querySelector('.subjin').value+'\n\n'+root.querySelector('.bodyin').value);});
  c.querySelectorAll('.send').forEach(b=>b.onclick=()=>{const id=decodeURIComponent(b.dataset.id);const
s=STORES.find(x=>x.id===id);const root=b.closest('.emin');const to=emailOf(s)||'';
    if(!to)toast(lang==='en'?'Add an email above, opening your mail app':'Agrega un correo arriba, abriendo tu app');
    window.location.href=`mailto:${to}?subject=${encodeURIComponent(root.querySelector('.subjin').value)}&body=${
encodeURIComponent(root.querySelector('.bodyin').value)}`;});
  c.querySelectorAll('.resetx').forEach(b=>b.onclick=()=>{const id=decodeURIComponent(b.dataset.id),i=+b.dataset.i;
const r=rec(id);if(r.edits[lang])delete r.edits[lang][i];persist();render();toast(lang==='en'?'Reset to template':'Plantilla restaurada');});
  c.querySelectorAll('.marktoday').forEach(b=>b.onclick=()=>{const id=decodeURIComponent(b.
dataset.id),i=+b.dataset.i;const r=rec(id);r.log['e'+i]=r.log['e'+i]||{};r.log['e'+i].date=iso(new Date());persist();render();
toast(lang==='en'?'Marked sent today':'Marcado enviado hoy');});
  c.querySelectorAll('.del').forEach(b=>b.onclick=()=>{const id=decodeURIComponent(b.dataset.id);if(confirm(lang===
'en'?'Remove this store from the plan?':'Quitar esta tienda del plan?')){rec(id).state='deleted';persist();render();
toast(lang==='en'?'Store removed':'Tienda quitada');}});
  c.querySelectorAll('.noresp').forEach(b=>b.onclick=()=>{const id=decodeURIComponent(b.dataset.id);rec(id).state=' noresp';persist();render();toast(lang==='en'?'Moved to No Response':'Movida a Sin Respuesta');});
  c.querySelectorAll('.back').forEach(b=>b.onclick=()=>{const id=decodeURIComponent(b.dataset.id);rec(id).state=' active';persist();render();toast(lang==='en'?'Returned to active':'Regresada a activas');});
  c.querySelectorAll('.mk').forEach(el=>el.onclick=()=>{const d=el.closest('.grow').querySelectorAll('.emd')[+el.
dataset.i];if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'center'});}});
}
function buildSubtabs(){
  const bar=document.getElementById('subbar');
  if(tab==='noresp'){const present=CATS.filter(c=>viewStores('noresp',c.id).length>0);
    if(!present.length){bar.innerHTML='';return;}}
  bar.innerHTML=CATS.map(c=>{const n=viewStores(tab,c.id).length;return `<button class="subtab ${subcat[tab]===c.id?'on':''}" data-cat="${c.id}">${lang==='en'?c.en:c.es}<span class="c">${n}</span></button>
`;}).join('')
    + (tab==='noresp'?'':`<button class="research-btn" id="rbtn">${lang==='en'?'Deep Research':'Deep Research'}
</button>`);
  bar.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{subcat[tab]=b.dataset.cat;showResearch=false;render();});
  const rb=document.getElementById('rbtn');if(rb)rb.onclick=()=>{showResearch=!showResearch;render();};
}
function buildResearch(){
  const box=document.getElementById('research');
  if(tab==='noresp'||!showResearch){box.innerHTML='';return;}
  const cat=subcat[tab];const key=tab+':'+cat;const list=RESEARCH[key]||[];
  const gq=GOOGLE[key]||'';const gurl='https://www.google.com/search?q='+encodeURIComponent(gq);
  const catLabel=(CATS.find(c=>c.id===cat)||{}).en;const geoLabel=(TABS.find(x=>x.id===tab)||{}).en;
  let cards=list.map(c=>{const added=!!STORES.find(s=>s.store===c.store&&s.cat===cat&&s.tab===tab);
    return `<div class="rcard"><div><div class="rn">${c.store}</div><div class="rm">${c.city}${c.web?' &middot; '+c.web:''}</div><div class="rw">${c.why}</div></div>
      <button class="addbtn" data-store="${encodeURIComponent(c.store)}" ${added?'disabled':''}>${added?
(lang==='en'?'Added':'Agregada'):(lang==='en'?'Add to plan':'Agregar al plan')}</button></div>`;}).join('');
  if(!list.length)cards=`<div class="rnote">${lang==='en'?'No saved candidates for this category yet. Use the live Google search below, or ask Claude to run a fresh deep research pass and add the results here.':'Aun no hay candidatas guardadas para esta categoria. Usa la busqueda en vivo de Google abajo, o pidele a Claude una nueva ronda de research y agregamos los resultados aqui.'}</div>`;
  box.innerHTML=`<div class="wrap"><div class="rpanel">
    <h3>${lang==='en'?'Deep Research':'Deep Research'}, ${catLabel} in ${geoLabel}</h3>
    <div class="rsub">${lang==='en'?'Candidate stores compiled from Google and trade research that fit this category. Add the ones you like; they drop into a Researched additions phase with the full three email sequence.':'Tiendas candidatas reunidas de Google y research del sector que encajan en esta categoria. Agrega las que te gusten; entran en una fase de Agregadas por research con la secuencia completa de tres correos.'}</div>
    ${cards}
    <a class="glink" href="${gurl}" target="_blank" rel="noopener">${lang==='en'?'Search Google live for more':'Buscar mas en Google en vivo'}</a>
    <div class="rnote">${lang==='en'?'A downloaded file cannot crawl Google by itself, so the live button opens a real Google search in a new tab, and the saved list above is a verified head start.':'Un archivo descargado no puede rastrear Google por si solo, asi que el boton en vivo abre una busqueda real de Google en otra pestana, y la lista de arriba es un comienzo verificado.'}</div>
  </div></div>`;
  box.querySelectorAll('.addbtn').forEach(b=>b.onclick=()=>{if(b.disabled)return;const name=decodeURIComponent(b.
dataset.store);const c=list.find(x=>x.store===name);addCandidate(c);});
}
function addCandidate(c){
  const cat=subcat[tab];const id=c.store+"|R:"+tab+":"+cat;
  if(STORES.find(s=>s.id===id)){toast(lang==='en'?'Already added':'Ya agregada');return;}
  const ph=(tab==='ca')?5:6;
  const obj={id,store:c.store,type:cat==='spa'?'Spa':(cat==='beauty'?'Beauty':'Home'),city:c.city,region:(tab==='ca'?' California':'International')+' (research)',status:'Research',email:'',web:(c.web||''),desc:c.why,phase:ph,tab:tab,cat:
cat,exp:false,whyEn:'Found via research: '+c.why,whyEs:'Encontrada via research: '+c.why};
  S.added.push(obj);STORES.push(obj);persist();render();toast(lang==='en'?'Added to plan':'Agregada al plan');
}
function copyText(t){const done=()=>toast(lang==='en'?'Copied to clipboard':'Copiado al portapapeles');if(navigator.
clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(()=>fb(t,done));else
fb(t,done);}
function fb(t,cb){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);cb();}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');
clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1900);}
const sdIn=document.getElementById('start');sdIn.value=iso(startDate());
sdIn.onchange=()=>{S.start=sdIn.value;persist();render();};
document.getElementById('teamsel').onchange=e=>{if(e.target.value==='__add'){const nm=
(prompt(lang==='en'?'New teammate name:':'Nombre del integrante:')||'').trim();if(nm&&!S.team.includes(nm)){S.
team.push(nm);persist();}}buildTeamSel();render();};
document.querySelectorAll('header .langtog button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;
document.querySelectorAll('header .langtog button').forEach(x=>x.classList.toggle('on',x===b));
buildTeamSel();render();});
buildTeamSel();render();
</script></body></html>
